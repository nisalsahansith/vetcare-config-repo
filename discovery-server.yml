server:
  port: 8761

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://10.10.0.25:8761/eureka/,http://10.10.0.23:8761/eureka/,http://10.10.0.24:8761/eureka/

  instance:
    prefer-ip-address: true

  server:
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: "*"